<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>深夜 check-in</title>
<style>
  :root {
    color-scheme: dark light;
    --bg: #0d1117;
    --bg2: #12181f;
    --card: rgba(255,255,255,.045);
    --line: rgba(255,255,255,.10);
    --fg: #e8edf3;
    --dim: #8b98a8;
    --accent: #6ea8fe;
    --accent-soft: rgba(110,168,254,.16);
    --ok: #5fd39a;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f6f9; --bg2: #eceff4;
      --card: rgba(0,0,0,.025); --line: rgba(0,0,0,.10);
      --fg: #1a2029; --dim: #5d6b7c;
      --accent: #2563eb; --accent-soft: rgba(37,99,235,.12);
      --ok: #14855c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(1100px 600px at 15% -10%, var(--bg2), var(--bg)) fixed;
    color: var(--fg);
    font-family: "Noto Sans TC", "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 40px 20px 120px; }

  header { margin-bottom: 30px; }
  .kicker { font-size: 13px; letter-spacing: .14em; color: var(--dim); text-transform: uppercase; }
  h1 { font-size: 26px; margin: 8px 0 4px; font-weight: 650; letter-spacing: -.01em; }
  .sub { color: var(--dim); font-size: 14px; }

  section {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px 18px 20px;
    margin-bottom: 14px;
    backdrop-filter: blur(8px);
  }
  .q { font-size: 15px; font-weight: 600; margin-bottom: 3px; }
  .hint { font-size: 12.5px; color: var(--dim); margin-bottom: 13px; }

  .chips { display: flex; flex-wrap: wrap; gap: 9px; }
  .chip {
    appearance: none;
    font: inherit;
    font-size: 14.5px;
    color: var(--fg);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 11px 15px;
    min-height: 46px;
    cursor: pointer;
    transition: background .16s ease, border-color .16s ease, transform .1s ease;
  }
  .chip:hover { border-color: var(--accent); }
  .chip:active { transform: scale(.97); }
  .chip[aria-pressed="true"] {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }
  .chips.mood .chip { min-width: 92px; text-align: center; }

  details { margin-bottom: 14px; }
  summary {
    cursor: pointer; color: var(--dim); font-size: 14px;
    padding: 10px 4px; list-style: none;
  }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "＋ "; }
  details[open] summary::before { content: "－ "; }
  textarea {
    width: 100%; min-height: 84px; margin-top: 8px;
    background: var(--card); color: var(--fg);
    border: 1px solid var(--line); border-radius: 12px;
    padding: 12px; font: inherit; font-size: 14.5px; resize: vertical;
  }

  .bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 14px 20px calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 60%, transparent);
  }
  .bar-inner { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 14px; }
  #send {
    flex: 1; appearance: none; font: inherit; font-size: 16px; font-weight: 650;
    color: #fff; background: var(--accent); border: 0; border-radius: 14px;
    padding: 15px; cursor: pointer; transition: filter .16s ease, transform .1s ease;
  }
  #send:hover { filter: brightness(1.08); }
  #send:active { transform: scale(.99); }
  #send:disabled { opacity: .45; cursor: default; }
  #status { color: var(--ok); font-size: 14px; min-width: 0; }

  .done { text-align: center; padding: 60px 0; }
  .done h2 { font-size: 22px; margin: 0 0 8px; }
  .done p { color: var(--dim); margin: 0; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <header>
    <div class="kicker">深夜 check-in</div>
    <h1 id="dateLabel">—</h1>
    <div class="sub">全部用點的就好，選完按最下面的送出。</div>
  </header>

  <section data-group="meals" data-multi="1">
    <div class="q">正餐大概是哪幾種？</div>
    <div class="hint">可複選</div>
    <div class="chips">
      <button class="chip" data-v="外食便當／自助餐">外食便當／自助餐</button>
      <button class="chip" data-v="麵食／小吃">麵食／小吃</button>
      <button class="chip" data-v="速食（麥當勞那類）">速食（麥當勞那類）</button>
      <button class="chip" data-v="家裡吃／自己弄">家裡吃／自己弄</button>
      <button class="chip" data-v="被臨時叫去的飯局">被臨時叫去的飯局</button>
      <button class="chip" data-v="有一餐沒吃">有一餐沒吃</button>
    </div>
  </section>

  <section data-group="drinks" data-multi="1">
    <div class="q">喝了什麼？</div>
    <div class="hint">可複選</div>
    <div class="chips">
      <button class="chip" data-v="早上咖啡加低脂牛奶">早上咖啡加低脂牛奶</button>
      <button class="chip" data-v="茶 2–3 公升（綠茶為主）">茶 2–3 公升（綠茶為主）</button>
      <button class="chip" data-v="含糖飲料">含糖飲料</button>
      <button class="chip" data-v="只有白開水">只有白開水</button>
    </div>
  </section>

  <section data-group="latenight" data-multi="0">
    <div class="q">健身完（約 00:00）到睡前有吃嗎？</div>
    <div class="hint">單選</div>
    <div class="chips">
      <button class="chip" data-v="沒吃，維持住了">沒吃，維持住了</button>
      <button class="chip" data-v="有小吃一點">有小吃一點</button>
      <button class="chip" data-v="吃得不少">吃得不少</button>
      <button class="chip" data-v="沒去健身">沒去健身</button>
    </div>
  </section>

  <section data-group="caffeine" data-multi="0">
    <div class="q">最後一杯含咖啡因的茶／咖啡幾點？</div>
    <div class="hint">單選</div>
    <div class="chips">
      <button class="chip" data-v="18:00 前">18:00 前</button>
      <button class="chip" data-v="18–21 點">18–21 點</button>
      <button class="chip" data-v="21–24 點">21–24 點</button>
      <button class="chip" data-v="睡前還在喝">睡前還在喝</button>
    </div>
  </section>

  <section data-group="mood" data-multi="0">
    <div class="q">今天心情幾分？</div>
    <div class="hint">1 最低、5 最高</div>
    <div class="chips mood">
      <button class="chip" data-v="1">1 很低</button>
      <button class="chip" data-v="2">2 偏低</button>
      <button class="chip" data-v="3">3 普通</button>
      <button class="chip" data-v="4">4 不錯</button>
      <button class="chip" data-v="5">5 很好</button>
    </div>
  </section>

  <section data-group="stressors" data-multi="1">
    <div class="q">今天有沒有這些？</div>
    <div class="hint">可複選，都沒有就不用選</div>
    <div class="chips">
      <button class="chip" data-v="備考進度落後感">備考進度落後感</button>
      <button class="chip" data-v="時間被別人打斷">時間被別人打斷</button>
      <button class="chip" data-v="家人／朋友的事">家人／朋友的事</button>
      <button class="chip" data-v="就是累">就是累</button>
      <button class="chip" data-v="今天還算順">今天還算順</button>
    </div>
  </section>

  <details>
    <summary>想補一句話再點開（不用也可以）</summary>
    <textarea id="note" placeholder="例如：晚上被叫去吃飯，回來就不想念書了"></textarea>
  </details>
</div>

<div class="bar" id="bar">
  <div class="bar-inner">
    <button id="send">送出</button>
    <span id="status"></span>
  </div>
</div>

<script>
  const WD = ['日','一','二','三','四','五','六'];
  const qs = new URLSearchParams(location.search);
  // 「剛過完的那一天」：凌晨 5 點前算昨天，之後（含深夜還沒跨日）算今天
  const now = new Date();
  const d = qs.get('date')
    ? new Date(qs.get('date') + 'T12:00:00')
    : (now.getHours() < 5 ? new Date(now.getTime() - 86400000) : now);
  const pad = n => String(n).padStart(2, '0');
  const dateStr = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  document.getElementById('dateLabel').textContent =
    (d.getMonth() + 1) + '/' + d.getDate() + '（週' + WD[d.getDay()] + '）過得如何？';

  document.querySelectorAll('section').forEach(sec => {
    const multi = sec.dataset.multi === '1';
    sec.querySelectorAll('.chip').forEach(chip => {
      chip.setAttribute('aria-pressed', 'false');
      chip.addEventListener('click', () => {
        const on = chip.getAttribute('aria-pressed') === 'true';
        if (!multi) sec.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', 'false'));
        chip.setAttribute('aria-pressed', on && multi ? 'false' : String(!on));
      });
    });
  });

  function collect() {
    const out = { date: dateStr };
    document.querySelectorAll('section').forEach(sec => {
      const picked = [...sec.querySelectorAll('.chip[aria-pressed="true"]')].map(c => c.dataset.v);
      out[sec.dataset.group] = sec.dataset.multi === '1' ? picked : (picked[0] || null);
    });
    out.note = document.getElementById('note').value.trim();
    return out;
  }

  document.getElementById('send').addEventListener('click', async () => {
    const btn = document.getElementById('send');
    btn.disabled = true;
    document.getElementById('status').textContent = '送出中…';
    try {
      const r = await fetch('/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(collect())
      });
      if (!r.ok) throw new Error(r.status);
      document.getElementById('app').innerHTML =
        '<div class="done"><h2>收到了 🌙</h2><p>可以回去對話視窗，我會把記錄寫進健康日誌。</p></div>';
      document.getElementById('bar').remove();
    } catch (e) {
      btn.disabled = false;
      document.getElementById('status').textContent = '送出失敗，再按一次';
    }
  });
</script>
</body>
</html>
