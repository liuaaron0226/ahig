[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ahig"
version = "0.2.1"
description = "Athlete Health Intelligence Graph contract and validation core"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.20",
  "numpy>=2.0",
  "scipy>=1.13",
  "rdflib>=7.0",
  "pyshacl>=0.30",
]

[tool.setuptools.packages.find]
include = ["ahig*"]
