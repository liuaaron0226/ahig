<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmoothUI button — 純 CSS 移植</title>
<style>
:root{
  --bg:#0a0d13; --fg:#e8ecf2; --muted:#8b97a8;
  --brand:#0090D5; --brand-2:#007BFF;
  --amber:#f0a020; --amber-2:#d98410;
  --radius:8px;
}
*{box-sizing:border-box}
body{
  margin:0; padding:56px 40px 80px; background:var(--bg); color:var(--fg);
  font:400 15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;
}
h1{font-size:30px;font-weight:600;letter-spacing:-.02em;margin:0 0 6px}
p.sub{color:var(--muted);margin:0 0 40px;font-size:14px}
h2{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
   color:var(--muted);margin:40px 0 14px;padding-bottom:8px;border-bottom:1px solid #ffffff14}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
code.n{font:500 11px/1 ui-monospace,monospace;color:var(--muted);
       display:block;margin-top:10px}

/* ---- base（原始碼 cva 的 base string 直譯）---- */
.btn{
  position:relative; display:inline-flex; align-items:center; justify-content:center;
  gap:.5rem; white-space:nowrap; cursor:pointer; font-weight:500;
  border:0; outline:0; text-decoration:none;
  height:40px; padding:0 16px; font-size:14px; border-radius:var(--radius);
  transition:transform .15s ease-out, background-color .15s ease-out,
             border-color .15s ease-out, color .15s ease-out, box-shadow .15s ease-out;
}
.btn:active{transform:scale(.97)}
.btn:focus-visible{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--brand)}
.btn:disabled{pointer-events:none;opacity:.5}
@media (prefers-reduced-motion:reduce){
  .btn{transition:none}
  .btn:active{transform:none}
}

/* ---- 顏色軸：只設 CSS 變數（原始碼的核心手法）---- */
.c-accent {--btn:var(--brand);  --btn-hover:var(--brand-2); --btn-fg:#fff}
.c-amber  {--btn:var(--amber);  --btn-hover:var(--amber-2); --btn-fg:#1a1206}
.c-neutral{--btn:var(--fg);     --btn-hover:#c8d0dc;        --btn-fg:var(--bg)}

/* ---- 外觀軸：通吃上面的變數 ---- */
.v-candy{
  background:linear-gradient(to bottom,var(--btn),var(--btn-hover));
  color:var(--btn-fg);
  border:.5px solid #ffffff40;
  text-shadow:0 1px 2px #00000040;
  box-shadow:0 4px 6px -1px #00000033, 0 0 0 1px color-mix(in oklab,var(--fg) 15%,var(--btn));
}
.v-candy:hover{background:linear-gradient(to bottom,var(--btn-hover),var(--btn-hover))}

.v-solid{background:var(--btn);color:var(--btn-fg);box-shadow:0 1px 2px #0000000d}
.v-solid:hover{background:var(--btn-hover)}

.v-outline{
  background:#11151c;color:var(--btn);
  box-shadow:0 1px 2px #00000026, 0 0 0 1px color-mix(in oklab,var(--fg) 15%,transparent);
}
.v-outline:hover{background:#161b24}

.v-soft{background:color-mix(in oklab,var(--btn) 12%,transparent);color:var(--btn)}
.v-soft:hover{background:color-mix(in oklab,var(--btn) 18%,transparent)}

.v-ghost{background:transparent;color:var(--btn)}
.v-ghost:hover{background:color-mix(in oklab,var(--btn) 10%,transparent)}

/* ---- 關鍵：inset 頂端白色髮絲線（原始碼 destructive 變體的配方）---- */
.v-premium{
  background:linear-gradient(to bottom,var(--btn),var(--btn-hover));
  color:var(--btn-fg);
  text-shadow:0 1px 2px #00000040;
  box-shadow:
    0 1px 2px #00000066,
    0 0 0 1px color-mix(in oklab,var(--btn) 80%,black),
    inset 0 .75px 0 #ffffff33;
}
.v-premium:hover{background:linear-gradient(to bottom,var(--btn-hover),var(--btn-hover))}

/* ---- 尺寸／形狀軸 ---- */
.s-sm{height:36px;padding:0 12px;font-size:13px;gap:6px}
.s-lg{height:44px;padding:0 32px;font-size:16px;border-radius:10px}
.shape-pill{border-radius:999px}
.shape-square{border-radius:0}
.s-icon{width:40px;height:40px;padding:0}
svg{width:16px;height:16px;flex-shrink:0}
</style>
</head>
<body>

<h1>SmoothUI 的按鈕 — 純 CSS 移植</h1>
<p class="sub">來源：<code>packages/smoothui/components/smooth-button/index.tsx</code>（MIT）。零依賴、零 build step，可直接貼進單檔網站。</p>

<h2>質感的來源：inset 頂端髮絲線</h2>
<div class="row">
  <button class="btn c-accent v-premium">開始使用</button>
  <button class="btn c-amber v-premium">下載規格書</button>
  <button class="btn c-neutral v-premium">聯絡我們</button>
</div>
<code class="n">box-shadow: 0 1px 2px …, 0 0 0 1px …, inset 0 .75px 0 #ffffff33</code>

<h2>candy — 漸層＋外框 ring</h2>
<div class="row">
  <button class="btn c-accent v-candy">Primary</button>
  <button class="btn c-amber v-candy">Amber</button>
  <button class="btn c-accent v-candy shape-pill">Pill</button>
  <button class="btn c-accent v-candy s-lg">Large</button>
</div>

<h2>solid / outline / soft / ghost</h2>
<div class="row">
  <button class="btn c-accent v-solid">Solid</button>
  <button class="btn c-accent v-outline">Outline</button>
  <button class="btn c-accent v-soft">Soft</button>
  <button class="btn c-accent v-ghost">Ghost</button>
  <button class="btn c-neutral v-outline">Neutral outline</button>
</div>

<h2>尺寸與圖示</h2>
<div class="row">
  <button class="btn c-accent v-candy s-sm">Small</button>
  <button class="btn c-accent v-candy">Default</button>
  <button class="btn c-accent v-candy s-lg">Large</button>
  <button class="btn c-accent v-candy s-icon" aria-label="下一步">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
         stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </button>
  <button class="btn c-accent v-candy" disabled>Disabled</button>
</div>

<h2>帶圖示（真實用途）</h2>
<div class="row">
  <button class="btn c-accent v-premium s-lg">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round"
         style="width:20px;height:20px"><path d="M12 3v13M7 12l5 5 5-5M5 21h14"/></svg>
    下載完整規格
  </button>
  <button class="btn c-neutral v-outline s-lg">先看規格表</button>
</div>

</body>
</html>
